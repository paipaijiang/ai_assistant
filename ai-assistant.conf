server {
    listen 80;
    server_name ai.mc945.xyz www.ai.mc945.xyz;
    # 强制 HTTP 状态码 301 重定向到 HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name ai.mc945.xyz www.ai.mc945.xyz;

    # SSL 证书配置
    ssl_certificate "/ssl/ai.mc945.xyz.pem";
    ssl_certificate_key "/ssl/ai.mc945.xyz.key";
    
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 日志记录
    error_log /var/log/nginx/ai_error_ssl.log notice;
    access_log /var/log/nginx/ai_access_ssl.log main;
    
    # 重点：精准匹配 Streamlit 的 WebSocket 通信路径
    location ^~ /_stcore/stream {
        proxy_pass http://127.0.0.1:1234/_stcore/stream;
        proxy_http_version 1.1;
        
        # 建立 WebSocket 握手必须的 Header
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 传递客户端真实信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 长连接不应该被缓冲
        proxy_buffering off;
        
        # 延长超时时间，防止 AI 思考时间过长导致连接被 Nginx 断开
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # 处理普通的 HTTP 静态资源请求
    location / {
        proxy_pass http://127.0.0.1:1234;
        proxy_http_version 1.1;
        
        # 虽然是普通请求，但也建议保留 Upgrade 支持，防止 Streamlit 其他功能失效
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关闭缓冲，确保流式输出（打字机效果）顺畅
        proxy_buffering off;
    }
}
